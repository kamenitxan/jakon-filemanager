<h2 mat-dialog-title>{{ i18n.translate('dialog.delete.title') }}</h2>
<div mat-dialog-content>
  <p>{{ i18n.translate('dialog.delete.confirm', { count: data.names.length }) }}</p>
  <ul class="fm-dialog-list">
    @for (name of data.names; track name) {
      <li>{{ name }}</li>
    }
  </ul>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ i18n.translate('common.cancel') }}</button>
  <button mat-flat-button color="warn" (click)="confirm()">{{ i18n.translate('common.delete') }}</button>
</div>
