<h2 mat-dialog-title>{{ i18n.translate('dialog.createFolder.title') }}</h2>
<div mat-dialog-content>
  <p class="fm-dialog-hint">{{ i18n.translate('dialog.createFolder.hint', { path: data.currentPath }) }}</p>
  <mat-form-field appearance="outline" class="fm-full-width">
    <mat-label>{{ i18n.translate('dialog.createFolder.label') }}</mat-label>
    <input matInput [formControl]="nameControl" (keyup.enter)="confirm()" cdkFocusInitial />
    @if (nameControl.invalid && nameControl.touched) {
      <mat-error>{{ i18n.translate('dialog.createFolder.error') }}</mat-error>
    }
  </mat-form-field>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ i18n.translate('common.cancel') }}</button>
  <button mat-flat-button color="primary" (click)="confirm()">{{ i18n.translate('common.create') }}</button>
</div>
